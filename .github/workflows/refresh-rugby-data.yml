name: Refresh rugby fixtures

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_live_data.py'
      - '.github/workflows/refresh-rugby-data.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data-fetch dependency
        run: pip install requests
      - name: Fetch fixtures and analytics
        env:
          RUGBY_API_KEY: ${{ secrets.RUGBY_API_KEY }}
        run: python scripts/fetch_live_data.py
      - name: Publish updated data
        run: |
          if [ -z "$(git status --porcelain -- data/live-data.json)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-data.json
          git commit -m "Refresh rugby fixtures and predictions [skip ci]"
          git push
